    ncurses:
      externals:
        - spec: ncurses@6.1.20180224+termlib abi=6
          prefix: /usr
      buildable: false
    m4:
      externals:
        - spec: m4@1.4.18
          prefix: /usr
      buildable: false
    cmake:
      externals:
        - spec: cmake@3.26.5
          prefix: /usr
      buildable: false
    pkgconf:
      externals:
        - spec: pkgconf@1.4.2
          prefix: /usr
      buildable: false
    gmake:
      externals:
        - spec: gmake@4.2.1
          prefix: /usr
      buildable: false
    all:
      prefer:
        - "%gcc@11"
      target: [x86_64_v3]

